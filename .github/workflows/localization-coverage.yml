# Posts the output of `hemtt localization coverage` to a single, continuously updated GitHub issue.
name: Localization coverage

on:
  workflow_call:
    inputs:
      title:
        type: string
        default: Localization coverage

permissions:
  contents: read
  issues: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: arma-actions/hemtt@v1

      - name: Update coverage issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
        run: |
          # hemtt prints a log line before the table; keep only the table rows
          table=$(hemtt localization coverage --format markdown | grep '^|')
          printf '%s\n\n%s\n\n_Updated for %s_\n' "Translation completeness per language." "$table" "$GITHUB_SHA" > body.md

          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
